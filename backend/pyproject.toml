[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "interact-backend"
version = "0.1.0"
description = "FastAPI backend for InterAct"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi~=0.162.0",
    "uvicorn~=0.54.0",
    "pydantic~=2.14",
    "pydantic-settings~=2.16",
    "sqlalchemy~=2.1.8",
    "psycopg[binary]~=3.3",
    "httpx2~=2.16",
    "itsdangerous~=2.2",
    "authlib~=1.9",
    # Authlib's web client uses httpx; the app and tests use httpx2.
    "httpx~=0.28.1",
    "alembic~=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
# Real-model checks are slow, so they only run when asked: pytest -m ollama
addopts = "-m 'not ollama'"
markers = [
    "postgres: needs the PostgreSQL server from DATABASE_URL; skipped when it is not running",
    "ollama: calls real models in a local Ollama; run with pytest -m ollama",
]
