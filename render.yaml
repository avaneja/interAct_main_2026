# Render blueprint: one free web service built from the Dockerfile.
# Values marked "sync: false" are secrets or addresses you enter in the Render dashboard;
# they never go in this file. See docs/deployment.md for every step.
services:
  - type: web
    name: interact
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL          # The Neon connection string.
        sync: false
      - key: PUBLIC_URL            # https://<your service>.onrender.com, no trailing slash.
        sync: false
      - key: SESSION_SECRET        # Random, made by Render; signs the sign-in cookie.
        generateValue: true
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY           # The Groq API key.
        sync: false
      # Groq's free plan limits each model to 8,000 tokens a minute, so the work is spread
      # over three models (checked on Groq on 2026-11-19); confirm they are still in your plan.
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_MODEL_CONVERSATION
        value: qwen/qwen3.8-27b
      - key: LLM_MODEL_QUESTIONS
        value: openai/gpt-oss-20b
      - key: LLM_MODEL_DOCUMENTS
        value: openai/gpt-oss-20b
      - key: LLM_MODEL_GRADING
        value: openai/gpt-oss-120b
      - key: LLM_REASONING_EFFORT  # Fewer hidden "thinking" tokens from gpt-oss.
        value: low
      - key: DOCUMENT_SOURCE_TOKENS
        value: "1200"
      - key: LLM_MAX_RETRIES       # Waits out a full tokens-per-minute budget instead of failing.
        value: "5"
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      # Rule-based style checks only: one model call fewer per question.
      - key: STYLE_CHECK
        value: rules
      - key: DEV_LOGIN
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
